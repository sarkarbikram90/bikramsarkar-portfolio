<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="64" height="64" rx="16" fill="#0f0f17"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#2a2a38" stroke-width="1.5"/>
  <!-- Bold B matching site typography -->
  <text x="15" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#f5f5f7" letter-spacing="-1">B</text>
  <!-- Brand gradient dot -->
