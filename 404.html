<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Bikram Sarkar</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      --bg: #0a0a0f;
      --card: #16161f;
      --text: #f5f5f7;
      --muted: #8b8b95;
      --border: #2a2a35;
      --primary: #6366f1;
      --accent: #22d3ee;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    }
    main {
      max-width: 480px;
      width: 100%;
      padding: 40px 32px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      text-align: center;
    }
    .code {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    h1 { font-size: 1.25rem; margin-bottom: 10px; }
    p { color: var(--muted); line-height: 1.6; margin-bottom: 24px; }
    a {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #0a0a0f;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { opacity: 0.92; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you requested does not exist on bikramsarkar.space.</p>
    <a href="/">Return to Portfolio</a>
  </main>
</body>
</html>
