name: Build, Sign & Promote Release

on:
  push:
    branches: [main]
    # Strict path allowlist: GitOps PR merges under deploy/gitops/** NEVER trigger a new build loop.
    paths:
      - "index.html"
      - "404.html"
      - "profile.png"
      - "favicon.*"
      - "Bikram_Sarkar_DevOps_SRE_Resume.pdf"
      - "assets/**"
      - "deploy/docker/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-portfolio
  cancel-in-progress: false

env:
  GAR_LOCATION: ${{ vars.GAR_LOCATION || 'us-central1' }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'portfolio-images' }}
  IMAGE_NAME: portfolio

jobs:
  build-sign-and-promote:
    name: Build, Scan, SBOM, Sign & Open GitOps PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required GCP repository variables
        run: |
          for v in GCP_PROJECT_ID GCP_WIF_PROVIDER GCP_CI_SERVICE_ACCOUNT; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing GitHub repository variable: $v. Run Terraform apply and set repository variables first."
              exit 1
            fi
          done
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_CI_SERVICE_ACCOUNT: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - name: Compute immutable release metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          REPO_URI="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          TAG="sha-${SHORT_SHA}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "repo_uri=${REPO_URI}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & load image for pre-publish verification
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: portfolio:release-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run read-only smoke test before publishing
        run: |
          docker run --rm -d --name portfolio-rel \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --tmpfs /var/cache/nginx:rw,noexec,nosuid,size=16m \
            -p 127.0.0.1:8080:8080 \
            portfolio:release-check

          trap 'docker rm -f portfolio-rel || true' EXIT

          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/healthz | grep -qx "ok"; then
              break
            fi
            sleep 1
          done

          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" -eq 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/profile.png)" -eq 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/does-not-exist)" -eq 404

      - name: Trivy vulnerability gate (SARIF + fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: portfolio:release-check
          format: sarif
          output: trivy-image-results.sarif
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Upload Trivy SARIF to GitHub Security
        if: always() && hashFiles('trivy-image-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-results.sarif

      - name: Authenticate to Google Cloud via Workload Identity Federation
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Push immutable container image to Artifact Registry
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.repo_uri }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha

      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.repo_uri }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ steps.meta.outputs.tag }}
          path: sbom.spdx.json
          retention-days: 90

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image & attest SBOM with Cosign keyless OIDC
        env:
          IMAGE_REF: ${{ steps.meta.outputs.repo_uri }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE_REF}"
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE_REF}"

      - name: Update GitOps production values with immutable @sha256 digest
        env:
          IMAGE_REPO: ${{ steps.meta.outputs.repo_uri }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          yq -i '.image.repository = strenv(IMAGE_REPO)' deploy/gitops/envs/prod/values-portfolio.yaml
          yq -i '.image.tag = strenv(IMAGE_TAG)' deploy/gitops/envs/prod/values-portfolio.yaml
          yq -i '.image.digest = strenv(IMAGE_DIGEST)' deploy/gitops/envs/prod/values-portfolio.yaml

      - name: Validate updated Helm chart with promoted values
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Helm lint promoted values
        run: helm lint deploy/charts/portfolio -f deploy/gitops/envs/prod/values-portfolio.yaml

      - name: Open GitOps promotion Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: gitops/promote-${{ steps.meta.outputs.short_sha }}
          delete-branch: true
          commit-message: "chore(gitops): promote portfolio ${{ steps.meta.outputs.tag }}"
          title: "chore(gitops): promote portfolio ${{ steps.meta.outputs.tag }}"
          body: |
            Automated GitOps image promotion triggered by `${{ github.sha }}`.

            ### Release Artifact
            - **Image**: `${{ steps.meta.outputs.repo_uri }}@${{ steps.push.outputs.digest }}`
            - **Tag**: `${{ steps.meta.outputs.tag }}`
            - **Trivy Scan**: Passed (`HIGH,CRITICAL`, unfixed ignored)
            - **Cosign Signature & SPDX SBOM Attestation**: Published to Sigstore Rekor

            ### Verify Signature Locally
            ```bash
            cosign verify \
              --certificate-identity-regexp="^https://github.com/${{ github.repository }}/.github/workflows/release.yaml@refs/heads/main$" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
              "${{ steps.meta.outputs.repo_uri }}@${{ steps.push.outputs.digest }}"
            ```

            Merging this PR updates `deploy/gitops/envs/prod/values-portfolio.yaml` and triggers Argo CD reconciliation on GKE Autopilot.
          labels: |
            gitops
            automated-promotion
