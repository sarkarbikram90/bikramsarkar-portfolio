{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  labels:
    {{- include "portfolio.labels" . | nindent 4 }}
  annotations:
    networking.gke.io/certmap: {{ .Values.gateway.certMapName | quote }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName }}
  addresses:
    - type: NamedAddress
      value: {{ .Values.gateway.staticIpName }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
    {{- if .Values.gateway.redirectHttpToHttps }}
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "portfolio.fullname" . }}-https
  labels:
    {{- include "portfolio.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      sectionName: https
  hostnames:
    {{- range .Values.gateway.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    {{- if .Values.gateway.apiRoute.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.apiRoute.pathPrefix | quote }}
      backendRefs:
        - name: {{ .Values.gateway.apiRoute.serviceName }}
          port: {{ .Values.gateway.apiRoute.servicePort }}
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "portfolio.fullname" . }}
          port: {{ .Values.service.port }}
{{- if .Values.gateway.redirectHttpToHttps }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "portfolio.fullname" . }}-http-redirect
  labels:
    {{- include "portfolio.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      sectionName: http
  hostnames:
    {{- range .Values.gateway.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}
