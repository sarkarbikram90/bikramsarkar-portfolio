server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Health check endpoint for kubelet probes and GKE Gateway HealthCheckPolicy
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Always revalidate HTML entrypoints so deploys propagate immediately
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location ~* \.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Cache static media & downloadable assets
    location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico|pdf|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }
}

# Localhost-only stub_status for optional nginx-prometheus-exporter sidecar (Phase 4)
server {
    listen 127.0.0.1:8081;
    server_name localhost;
    access_log off;

    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
}
