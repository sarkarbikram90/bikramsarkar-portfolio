version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: "/deploy/docker"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: terraform
    directory: "/infra/terraform/environments/prod"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - terraform
    commit-message:
      prefix: "chore(terraform)"

  - package-ecosystem: gomod
    directory: "/services/analytics-api"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "chore(analytics-api)"

  - package-ecosystem: docker
    directory: "/services/analytics-api"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(docker)"
