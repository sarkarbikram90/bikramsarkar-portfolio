name: CI & Security Checks

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "infra/terraform/**"
      - "README.md"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "infra/terraform/**"
      - "README.md"
      - "LICENSE"

# Default-deny permissions; grant minimal scopes per job
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helm-and-k8s:
    name: Helm Lint & Kubeconform
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.3

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Lint Helm charts (GKE, local, and prod GitOps values)
        run: |
          helm lint deploy/charts/portfolio
          helm lint deploy/charts/portfolio -f deploy/charts/portfolio/values-local.yaml
          helm lint deploy/charts/portfolio -f deploy/gitops/envs/prod/values-portfolio.yaml
          helm lint deploy/charts/analytics-api
          helm lint deploy/charts/analytics-api -f deploy/gitops/envs/prod/values-analytics-api.yaml

      - name: Render & validate Kubernetes schemas with kubeconform
        run: |
          helm template portfolio deploy/charts/portfolio \
            --namespace portfolio \
            -f deploy/gitops/envs/prod/values-portfolio.yaml \
            --set image.digest=sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            | kubeconform -strict -ignore-missing-schemas -summary
          helm template analytics-api deploy/charts/analytics-api \
            --namespace portfolio \
            -f deploy/gitops/envs/prod/values-analytics-api.yaml \
            | kubeconform -strict -ignore-missing-schemas -summary

  go-services-test:
    name: Go Services Vet & Race Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [analytics-api, digest-job]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27"
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Vet & test with race detector
        run: |
          go vet ./...
          go test -race -v ./...

  trivy-config-scan:
    name: Trivy Deploy & Service Dockerfile Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan deploy/ (Dockerfile, Helm, Argo CD)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: config
          scan-ref: deploy
          exit-code: "1"
          severity: MEDIUM,HIGH,CRITICAL
          trivy-config: trivy.yaml

      - name: Scan services/ Dockerfiles
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: config
          scan-ref: services
          exit-code: "1"
          severity: MEDIUM,HIGH,CRITICAL
          trivy-config: trivy.yaml

  docker-smoke-and-scan:
    name: Docker Build, Read-Only Smoke Test & Trivy Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build portfolio test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: portfolio:ci
          cache-from: type=gha,scope=portfolio
          cache-to: type=gha,mode=max,scope=portfolio

      - name: Build analytics-api test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/analytics-api
          file: services/analytics-api/Dockerfile
          load: true
          tags: analytics-api:ci
          cache-from: type=gha,scope=analytics-api
          cache-to: type=gha,mode=max,scope=analytics-api

      - name: Smoke test hardened read-only portfolio container
        run: |
          docker run --rm -d --name portfolio-ci \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --tmpfs /var/cache/nginx:rw,noexec,nosuid,size=16m \
            -p 127.0.0.1:8080:8080 \
            portfolio:ci

          trap 'docker logs portfolio-ci || true; docker rm -f portfolio-ci || true' EXIT

          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/healthz | grep -qx "ok"; then
              break
            fi
            sleep 1
          done

          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz)" -eq 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" -eq 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/profile.png)" -eq 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/Bikram_Sarkar_DevOps_SRE_Resume.pdf)" -eq 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/does-not-exist)" -eq 404

          HEADERS="$(curl -sI http://127.0.0.1:8080/)"
          echo "$HEADERS" | grep -iq "Strict-Transport-Security:"
          echo "$HEADERS" | grep -iq "Content-Security-Policy:"
          echo "$HEADERS" | grep -iq "X-Content-Type-Options: nosniff"
          echo "$HEADERS" | grep -iq "Cache-Control: no-cache"

          ASSET_HEADERS="$(curl -sI http://127.0.0.1:8080/profile.png)"
          echo "$ASSET_HEADERS" | grep -iq "Content-Security-Policy:"
          echo "$ASSET_HEADERS" | grep -iq "Cache-Control: public, max-age=604800"

      - name: Smoke test hardened read-only analytics-api container
        run: |
          docker run --rm -d --name analytics-ci \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            -p 127.0.0.1:8081:8080 \
            analytics-api:ci

          trap 'docker logs analytics-ci || true; docker rm -f analytics-ci || true' EXIT

          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8081/healthz | grep -qx "ok"; then
              break
            fi
            sleep 1
          done

          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -A 'Mozilla/5.0 (Linux)' \
            -d '{"event_type":"page_view","page_path":"/"}' \
            http://127.0.0.1:8081/api/v1/events)" -eq 202

      - name: Trivy scan portfolio image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: portfolio:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Trivy scan analytics-api image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: analytics-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
