worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # All runtime temp directories live under /tmp for readOnlyRootFilesystem support
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Structured JSON access logs compatible with Google Cloud Logging
    log_format json_combined escape=json
        '{'
          '"severity":"INFO",'
          '"timestamp":"$time_iso8601",'
          '"httpRequest":{'
            '"requestMethod":"$request_method",'
            '"requestUrl":"$request_uri",'
            '"status":$status,'
            '"responseSize":"$bytes_sent",'
            '"userAgent":"$http_user_agent",'
            '"referer":"$http_referer",'
            '"protocol":"$server_protocol",'
            '"latency":"${request_time}s"'
          '},'
          '"trace":"$http_x_cloud_trace_context",'
          '"request_id":"$request_id"'
        '}';

    access_log /dev/stdout json_combined;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
