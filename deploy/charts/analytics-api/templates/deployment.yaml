apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "analytics-api.fullname" . }}
  labels:
    {{- include "analytics-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "analytics-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "analytics-api.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "analytics-api.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      terminationGracePeriodSeconds: 15
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "analytics-api.selectorLabels" . | nindent 14 }}
      containers:
        - name: analytics-api
          image: {{ include "analytics-api.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.containerPort | quote }}
            - name: GCP_PROJECT_ID
              value: {{ .Values.config.gcpProjectId | quote }}
            - name: PUBSUB_TOPIC_ID
              value: {{ .Values.config.pubsubTopicId | quote }}
            - name: OTEL_SERVICE_NAME
              value: "analytics-api"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.config.otlpEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: {{ .Values.config.otlpInsecure | quote }}
            - name: RATE_LIMIT_PER_MINUTE
              value: {{ .Values.config.rateLimitPerMinute | quote }}
            - name: RATE_LIMIT_BURST
              value: {{ .Values.config.rateLimitBurst | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
